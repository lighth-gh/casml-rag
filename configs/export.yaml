# CASML references use textbook page numbers. The competition PDF has 12 pages
# of front matter, mapped during prepare with printed_page_offset: -12.
page_mode: printed
page_value_type: integer
fail_on_truncation: true
# Keep evidence-token/word-count warnings in validation.json without blocking export.
fail_on_unsupported_claims: false
max_answer_words: 140
allow_demo: false
