# Qwen2.5-1.5B-Instruct model/revision and prompts come from this config.
generation_config: generate.yaml
seed: 42
dtype: auto
# Leave room for the 1900-token context, instructions, question and answer.
max_length: 3072
min_train_examples: 200
min_dev_examples: 80
num_train_epochs: 1
max_steps: -1
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00001
warmup_ratio: 0.05
checkpoint_steps: 25
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]
